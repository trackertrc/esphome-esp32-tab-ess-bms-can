# Separate Master/Slave runtime: remaining Ah / measured module discharge A.
# Small discharges down to 0.02 A are supported; charging/standby => unavailable.
# System runtime: combine both BMS-reported remaining capacities with ESPHome's
# TAB System Power (CAN-derived: negative = discharge, positive = charge).
# No Home Assistant sensor import, no extra CAN polling or timers.
# Runtime is reported only during discharge; charging/idle => unavailable.
# This is an estimate to 0% (not an ESS minimum SoC cut-off).
# TAB L5.1 - optimized single polling loop (3 s minimum setting).
# 0x1F06 Master and 0x1F03 Master/Slave queried sequentially, with response confirmation.
# IMPORTANT: The 3 s setting is a minimum start-to-start interval. A complete loop
# with three 1.5 s BMS preparation periods typically takes longer than 3 seconds.
# If BMS firmware requires longer idle time, increase the pause between requests.
# Validated: 0x1F03 balance bitmask matches TAB software 5554 / 5550 on both packs.
# Adds candidate active-error readings plus confirmed balancing indicators.
# Also publishes the native FET voltage reading (not MOSFET gate state).
# Diagnostic raw values expose the 64-bit candidate; the mapping is not validated under fault.
# Stale/missing CAN data is NOT proof of no alarm: see the existing Detail Age sensors.
# TAB ESS CAN: One automatic schedule for ALL data (system, Master, Slave).
# Each cycle reads main data 0x1F06 and both battery detail blocks 0x1F03.
# Each request waits for its validated response; only a brief inter-request gap remains.
# All CAN requests originate from the single interval-triggered script (no boot / manual CAN polling).
# Capacity is read from native CAN detail floats; Cycle Count offset 135 is a candidate pending TAB-app comparison.
# No native BMS uptime sensor: the unavailable placeholders have been removed.
substitutions:
  name: esp32-bms-can
  friendly_name: ESP32 TAB ESS CAN

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
logger:
  level: INFO

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifiiotssid
  password: !secret wifipassword

button:
  - platform: restart
    name: "ESP32 Reboot"

switch:
  # The only polling enable/disable switch.
  - platform: template
    name: "TAB Refresh All Details Auto"
    id: all_detail_auto_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # A poll starts only when the timer has elapsed after enabling.
    on_turn_on:
      - lambda: 'id(last_all_detail_poll) = millis();'

number:
  # One interval for system info + Master detail + Slave detail.
  # Minimum start-to-start time, not a guaranteed full scan every 3 seconds.
  # Three 1.5-second BMS preparation periods alone require 4.5 seconds.
  # If the set interval is shorter, the running script cannot overlap itself.
  - platform: template
    name: "TAB Refresh All Details Interval"
    id: all_detail_update_interval_sec
    min_value: 3
    max_value: 86400
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 300
    unit_of_measurement: "s"
    entity_category: config

sensor:
  # Combined Master + Slave estimated time to 0% at the current discharge rate.
  # Uses the SAME native CAN value exposed as "TAB System Power" in Home Assistant.
  # BMS capacities are native CAN values. No HA input, CAN request, or runtime timer.
  - platform: template
    name: "TAB System Runtime Remaining Estimated"
    id: tab_system_runtime_remaining
    unit_of_measurement: "h"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:timer-sand
    update_interval: never
    lambda: |-
      if (!id(tab_system_power).has_state() ||
          !id(tab_m1_capacity_remaining_estimated).has_state() ||
          !id(tab_m2_capacity_remaining_estimated).has_state()) return NAN;

      const float power_w = id(tab_system_power).state;
      const float master_ah = id(tab_m1_capacity_remaining_estimated).state;
      const float slave_ah = id(tab_m2_capacity_remaining_estimated).state;
      if (!std::isfinite(power_w) ||
          !std::isfinite(master_ah) || !std::isfinite(slave_ah) ||
          master_ah < 0.0f || slave_ah < 0.0f) return NAN;

      // Negative power means discharge. At low load (<10 W), runtime is
      // deliberately unavailable because the estimate becomes unreliable.
      if (power_w >= -10.0f) return NAN;
      constexpr float nominal_voltage_v = 51.2f;
      const float remaining_wh = (master_ah + slave_ah) * nominal_voltage_v;
      const float hours = remaining_wh / (-power_w);
      return std::round(hours * 100.0f) / 100.0f;

  # Diagnostic: confirms that a *valid complete* detail response was parsed.
  # If Age keeps increasing, the BMS has not returned accepted cell data.
  - platform: template
    name: "TAB Master Detail Age"
    id: tab_master_detail_age
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (id(last_master_detail_received_ms) == 0) return NAN;
      return (float)((uint32_t)(millis() - id(last_master_detail_received_ms))) / 1000.0f;

  - platform: template
    name: "TAB Slave 1 Detail Age"
    id: tab_slave_detail_age
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (id(last_slave_detail_received_ms) == 0) return NAN;
      return (float)((uint32_t)(millis() - id(last_slave_detail_received_ms))) / 1000.0f;

  - platform: template
    name: "TAB Master Detail Updates Since Boot"
    id: tab_master_detail_updates
    entity_category: diagnostic
    accuracy_decimals: 0

  - platform: template
    name: "TAB Slave 1 Detail Updates Since Boot"
    id: tab_slave_detail_updates
    entity_category: diagnostic
    accuracy_decimals: 0

  # Voltage measured by TAB BMS at its power FET path. This is NOT a MOSFET ON/OFF flag.
  # 0x1F03 buf[91..94] as little-endian millivolts, confirmed against TAB diagnostics.
  - platform: template
